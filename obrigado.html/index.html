<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pagamento confirmado | Arremata+</title>
  <link rel="stylesheet" href="../checkout.html/css/style.css">
  <style>
    .thanks-main{max-width:560px;margin:0 auto;padding:64px 20px}
    .thanks-card{background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:40px 28px;text-align:center;box-shadow:0 8px 30px rgba(16,24,40,.08)}
    .thanks-icon{width:68px;height:68px;margin:0 auto 20px;border-radius:50%;background:#dff7ea;color:#138a4d;display:grid;place-items:center;font-size:34px;font-weight:800}
    .thanks-card h1{margin:0 0 10px;font-size:25px;color:#182230}
    .thanks-card p{margin:0 auto 24px;max-width:420px;color:#667085;line-height:1.6}
    .thanks-product{background:#f7f8fa;border-radius:12px;padding:14px;text-align:left;margin-bottom:24px;font-weight:700;color:#182230}
    .thanks-product small{display:block;color:#667085;font-weight:500;margin-top:4px}
    .thanks-button{display:inline-block;background:#1a73e8;color:#fff;padding:13px 24px;border-radius:8px;font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <main class="thanks-main">
    <section class="thanks-card" aria-live="polite">
      <div class="thanks-icon" aria-hidden="true">✓</div>
      <h1>Pagamento confirmado!</h1>
      <p>Recebemos seu Pix. Seu pedido foi registrado e as informações de entrega serão enviadas para o e-mail informado.</p>
      <div class="thanks-product" id="thanksProduct">Pedido confirmado<small id="thanksOrder"></small></div>
      <a class="thanks-button" href="../index.html/index.html">Voltar para a loja</a>
    </section>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var title = params.get("title");
      var order = params.get("order");
      if (title) document.getElementById("thanksProduct").firstChild.textContent = title;
      if (order) document.getElementById("thanksOrder").textContent = "Número do pedido: " + order;
    }());
  </script>
</body>
</html>
